<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Background */
body {
    background: linear-gradient(135deg, #28a745, #ffc107);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.login-box {
    width: 350px;
    background: #ffffff;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* Title */
.login-box h2 {
    color: #28a745;
    margin-bottom: 20px;
}

/* Input */
.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    font-size: 14px;
    color: #333;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 5px;
    outline: none;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #28a745;
}

/* Button */
.btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #28a745, #ffc107);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    opacity: 0.9;
}

/* Links */
.extra {
    margin-top: 15px;
    font-size: 14px;
}

.extra a {
    color: #28a745;
    text-decoration: none;
}

.extra a:hover {
    text-decoration: underline;
}

</style>

</head>
<body>

<div class="login-box">
    <h2>Customer Login</h2>

    <form action="dashboard.html">
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" placeholder="Enter Mobile Number" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Enter Password" required>
        </div>

        <button class="btn">Login</button>
    </form>

    <div class="extra">
        <p>New User? <a href="#">Register</a></p>
    </div>
</div>

</body>
</html>
