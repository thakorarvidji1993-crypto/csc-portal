<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Background */
body {
    background: linear-gradient(135deg, #28a745, #ffc107);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Box */
.login-box {
    width: 350px;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* Title */
.login-box h2 {
    color: #28a745;
    margin-bottom: 20px;
}

/* Input */
.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    font-size: 14px;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 5px;
    outline: none;
}

.input-group input:focus {
    border-color: #28a745;
}

/* Button */
.btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #28a745, #ffc107);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    opacity: 0.9;
}

/* Error */
.error {
    color: red;
    font-size: 14px;
    margin-top: 10px;
    display: none;
}

</style>
</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <form onsubmit="return loginAdmin()">

        <div class="input-group">
            <label>Admin ID</label>
            <input type="text" id="adminId" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="adminPass" required>
        </div>

        <button class="btn">Login</button>

        <div class="error" id="errorMsg">
            ❌ Invalid Login Details
        </div>

    </form>
</div>

<script>
function loginAdmin(){
    const id = document.getElementById("adminId").value;
    const pass = document.getElementById("adminPass").value;

    // Demo Credentials
    if(id === "admin" && pass === "1234"){
        localStorage.setItem("adminLogin", "true");
        window.location.href = "admin-panel.html";
        return false;
    } else {
        document.getElementById("errorMsg").style.display = "block";
        return false;
    }
}
</script>

</body>
</html>
