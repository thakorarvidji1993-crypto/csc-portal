<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    display: flex;
    background: #f5f5f5;
}

/* Sidebar */
.sidebar {
    width: 220px;
    height: 100vh;
    background: linear-gradient(#28a745, #1e7e34);
    color: white;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
}

.sidebar a {
    display: block;
    padding: 10px;
    color: white;
    text-decoration: none;
    margin: 10px 0;
    border-radius: 6px;
}

.sidebar a:hover {
    background: #ffc107;
    color: black;
}

/* Main */
.main {
    flex: 1;
    padding: 20px;
}

/* Top */
.topbar {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.topbar h3 {
    color: #28a745;
}

/* Filter */
.filter {
    margin-bottom: 15px;
}

.filter select {
    padding: 8px;
}

/* Table */
.table-box {
    background: white;
    padding: 15px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table th {
    background: #ffc107;
    padding: 10px;
}

table td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

/* Status */
.status {
    padding: 5px 10px;
    border-radius: 20px;
    color: white;
    font-size: 13px;
}

.pending { background: orange; }
.approved { background: green; }
.rejected { background: red; }

/* Buttons */
.btn {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.approve { background: green; color: white; }
.reject { background: red; color: white; }

</style>
</head>

<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#">📋 Applications</a>
    <a href="#">💳 Payments</a>
    <a href="admin-login.html">🚪 Logout</a>
</div>

<div class="main">

    <div class="topbar">
        <h3>View Applications</h3>
    </div>

    <!-- Filter -->
    <div class="filter">
        <select onchange="filterStatus(this.value)">
            <option value="all">All</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <!-- Table -->
    <div class="table-box">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminTable"></tbody>
        </table>
    </div>

</div>

<script>
let apps = JSON.parse(localStorage.getItem("applications")) || [];

function renderTable(filter = "all"){
    const table = document.getElementById("adminTable");
    table.innerHTML = "";

    apps.forEach((app, index) => {

        if(filter !== "all" && app.status !== filter) return;

        const row = `
        <tr>
            <td>${app.id}</td>
            <td>${app.service}</td>
            <td>${app.date}</td>
            <td><span class="status ${app.status.toLowerCase()}">${app.status}</span></td>
            <td>
                <button class="btn approve" onclick="updateStatus(${index}, 'Approved')">Approve</button>
                <button class="btn reject" onclick="updateStatus(${index}, 'Rejected')">Reject</button>
            </td>
        </tr>
        `;
        table.innerHTML += row;
    });
}

function updateStatus(index, status){
    apps[index].status = status;
    localStorage.setItem("applications", JSON.stringify(apps));
    renderTable();
}

function filterStatus(status){
    renderTable(status);
}

// Load table
renderTable();
</script>

</body>
</html>
