<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Payment</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #f5f5f5;
}

/* Container */
.container {
    max-width: 450px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    color: #28a745;
    margin-bottom: 20px;
}

/* Amount */
.amount-box {
    text-align: center;
    background: #f0fff4;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.amount-box h3 {
    color: #28a745;
}

/* Options */
.payment-option {
    margin: 10px 0;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
}

.payment-option:hover {
    border-color: #28a745;
}

/* Hidden sections */
.hidden {
    display: none;
}

/* Button */
.btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, #28a745, #ffc107);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

/* Success */
.success {
    display: none;
    text-align: center;
    color: green;
    margin-top: 15px;
}

</style>
</head>

<body>

<div class="container">
    <h2>Make Payment</h2>

    <div class="amount-box">
        <h3>Amount: ₹150</h3>
    </div>

    <!-- Payment Options -->
    <div class="payment-option" onclick="showOption('upi')">📱 UPI</div>
    <div class="payment-option" onclick="showOption('card')">💳 Card</div>
    <div class="payment-option" onclick="showOption('qr')">📷 QR Code</div>

    <!-- UPI -->
    <div id="upi" class="hidden">
        <p>Enter UPI ID</p>
        <input type="text" placeholder="example@upi" style="width:100%; padding:10px;">
    </div>

    <!-- Card -->
    <div id="card" class="hidden">
        <p>Card Number</p>
        <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" style="width:100%; padding:10px;">
    </div>

    <!-- QR -->
    <div id="qr" class="hidden" style="text-align:center;">
        <p>Scan QR Code</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=payment" />
    </div>

    <button class="btn" onclick="payNow()">Pay Now</button>

    <div class="success" id="successMsg">
        ✅ Payment Successful!
    </div>
</div>

<script>
function showOption(option){
    document.getElementById("upi").style.display = "none";
    document.getElementById("card").style.display = "none";
    document.getElementById("qr").style.display = "none";

    document.getElementById(option).style.display = "block";
}

function payNow(){
    document.getElementById("successMsg").style.display = "block";

    setTimeout(()=>{
        window.location.href = "dashboard.html";
    },2000);
}
</script>

</body>
</html>
